name: ARRS v0.1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node .github/scripts/setup-git.mjs
      - run: npm ci
      - run: npm run build
      - run: node dist/cli.js init
      - run: node dist/cli.js skills install
      - run: npm run check
      - run: npm test
      - run: npm run verify
      - run: node dist/cli.js proof run .agent/proof-plan.json --execute
      - run: node dist/cli.js audit --execute --require-level 4 --json
